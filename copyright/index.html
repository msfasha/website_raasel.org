<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Copyright — Raasel</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        line-height: 1.6;
      }

      main {
        max-width: 860px;
        margin: 0 auto;
        padding: 1.25rem;
      }

      .card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 1.25rem;
      }

      h1 {
        margin-top: 0;
        line-height: 1.3;
        font-size: 1.7rem;
      }

      p,
      li {
        font-size: 0.98rem;
      }

      nav {
        margin-bottom: 1rem;
        font-size: 0.92rem;
      }

      .top-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.75rem 0;
        margin-bottom: 1.5rem;
        border-bottom: 1px solid #e2e8f0;
      }

      .home-link {
        font-size: 2.5rem;
        text-decoration: none;
        color: #0f172a;
      }

      .lang-switch {
        display: flex;
        gap: 0.5rem;
        font-size: 0.9rem;
      }

      .lang-switch a {
        color: #64748b;
        text-decoration: none;
      }

      .lang-switch a:hover {
        color: #0f172a;
      }

      .lang-switch .active {
        color: #0f172a;
        font-weight: 600;
      }

      a {
        color: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <main>
      <nav class="top-nav">
        <a href="/" class="home-link">⌂</a>
        <div class="lang-switch">
          <a href="/copyright" class="active">EN</a>
          <span>|</span>
          <a href="/ar/copyright">العربية</a>
        </div>
      </nav>
      <article class="card">
        <h1>Copyright — Raasel</h1>
        <p>© 2026 Raasel. All rights reserved.</p>

        <p>
          The Raasel name, logo, and brand are proprietary and may not be used
          without permission.
        </p>
        <p>Contact: legal@raasel.com</p>
      </article>
    </main>
  </body>
</html>
